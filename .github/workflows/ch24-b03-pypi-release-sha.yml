name: "CH24 B03 PyPI release hash reference (research only)"
on:
  push:
    branches:
      - research/ch24-b03-pypi-release-sha-20261113
permissions:
  contents: read
jobs:
  official-pypi-release-shas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve official PyPI SHA256 for 21 exact wheel names
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.parse, ssl
          files=["certifi-2026.7.22-py3-none-any.whl","cffi-1.17.1-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl","charset_normalizer-3.5.2-cp312-cp312-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl","click-8.5.0-py3-none-any.whl","decorator-5.3.1-py3-none-any.whl","future-1.0.0-py3-none-any.whl","geocoder-1.38.1-py2.py3-none-any.whl","geographiclib-2.1-py3-none-any.whl","geopy-2.4.1-py3-none-any.whl","h3-3.7.7-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl","idna-3.20-py3-none-any.whl","numpy-1.26.4-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl","pycparser-3.0-py3-none-any.whl","python_dateutil-2.8.2-py2.py3-none-any.whl","pytz-2024.1-py2.py3-none-any.whl","ratelim-0.1.6-py2.py3-none-any.whl","requests-2.32.3-py3-none-any.whl","setuptools-84.2.1-py3-none-any.whl","six-1.17.0-py2.py3-none-any.whl","tzdata-2026.4-py2.py3-none-any.whl","urllib3-2.8.0-py3-none-any.whl"]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise RuntimeError("NO_REDIRECT")
          def norm(name):
              return re.sub(r"[-_.]+","-",name.lower())
          result=[]
          opener=urllib.request.build_opener(NoRedirect())
          for filename in files:
              bits=filename.split("-")
              project=norm(bits[0]);version=bits[1]
              url="https://pypi.org/pypi/"+urllib.parse.quote(project,safe="")+"/"+urllib.parse.quote(version,safe="")+"/json"
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"Interplay-B03-Public-Reference/1"})
              with opener.open(req,timeout=30) as response:
                  assert response.status==200
                  raw=response.read(5000000)
                  assert len(raw)<5000000
                  release=json.loads(raw)
              assert norm(release["info"]["name"])==project and release["info"]["version"]==version
              matching=[r for r in release["urls"] if r.get("filename")==filename and r.get("packagetype")=="bdist_wheel"]
              assert len(matching)==1, "UNPUBLISHED_WHEEL:"+filename
              assert not matching[0].get("yanked"), "YANKED_WHEEL:"+filename
              digest=matching[0]["digests"]["sha256"]
              assert re.fullmatch(r"[a-f0-9]{64}",digest), "INVALID_SHA:"+filename
              result.append((filename,digest))
          assert len(result)==len(files)==21
          for name, digest in sorted(result):
              print("CH24_B03_OFFICIAL_PYPI_WHEEL_SHA="+name+"="+digest,flush=True)
          print("CH24_B03_PYPI_OFFICIAL_RELEASE_HASH_RECORDS=PASS_21_21",flush=True)
          print("CH24_B03_GITHUB_PUBLIC_RELEASE_REFERENCE_ONLY=YES",flush=True)
          print("CH24_B03_GITLAB_PRIVATE_WHEELS_NOT_ACCESSED=YES",flush=True)
          print("CH24_B03_B03_SCIENTIFIC_CERTIFICATION=NOT_RUN",flush=True)
          
          PY
